apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-metrics-dashboard
  namespace: llm
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"vllm-metrics-dashboard"}}'
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vllm-metrics-dashboard-discovery
  namespace: llm
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vllm-metrics-dashboard-discovery
  namespace: llm
subjects:
  - kind: ServiceAccount
    name: vllm-metrics-dashboard
    namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vllm-metrics-dashboard-discovery
