apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vllm-metrics-dashboard-monitoring-view
subjects:
  - kind: ServiceAccount
    name: vllm-metrics-dashboard
    namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vllm-metrics-dashboard-auth-delegator
subjects:
  - kind: ServiceAccount
    name: vllm-metrics-dashboard
    namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
