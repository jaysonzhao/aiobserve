apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiobs-mcp-from-console
spec:
  podSelector:
    matchLabels:
      app: aiobs-mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-console
      ports:
        - protocol: TCP
          port: 8085
